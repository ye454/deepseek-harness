- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: .work-node-gateway-store

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    watch: false

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 0

- id: work-control
  name: '../../../../src/internal/control/index.ts'

- id: work-execution
  name: '../../../../src/internal/execution/index.ts'

- id: work-node
  name: '../../../../src/internal/node/index.ts'

- id: work-environment
  name: '../../../../src/internal/environment/index.ts'

- id: work-node-gateway
  name: '../../../../src/faces/node-gateway/index.ts'
  config:
    nodes:
      pc2: WORK_NODE_TEST_SECRET
    maxRequestBodyBytes: 65536
    maxPromptBytes: 16384
    maxCommandsPerPoll: 8
    maxClockSkewMs: 30000
    heartbeatTimeoutMs: 60000
    sweepIntervalMs: 60000
